# Local development stack (r0-solution-structure). Development credentials only; never reuse them elsewhere.
#   docker compose -f deploy/compose/compose.yaml up -d
name: teambeats
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: postgres_dev_only
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-teambeats.sh:ro
      - ../db/bootstrap.sql:/teambeats/bootstrap.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: teambeats
      RABBITMQ_DEFAULT_PASS: rabbit_dev_only
    ports: ["5672:5672", "15672:15672"]

  # Malware scanning of uploads (spec 016). Set Scanning__ClamAv__Host=localhost to use it from the API.
  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]

  # Object storage: R0 uses the file-system adapter. MinIO joins with the S3 adapter in R1.

volumes:
  pgdata:
