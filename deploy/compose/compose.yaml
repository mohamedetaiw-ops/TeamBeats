# Local development stack (r0-solution-structure). Development credentials only; never reuse them elsewhere.
#   docker compose -f deploy/compose/compose.yaml up -d
name: teambeats
services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: postgres_dev_only
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-teambeats.sh:ro
      - ../db/bootstrap.sql:/teambeats/bootstrap.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: teambeats
      RABBITMQ_DEFAULT_PASS: rabbit_dev_only
    ports: ["5672:5672", "15672:15672"]

  # Malware scanning of uploads (spec 016). Set Scanning__ClamAv__Host=localhost to use it from the API.
  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]

  # Office to PDF conversion for document previews (spec 011 FR-009). Set Conversion__Gotenberg__Url=http://localhost:3000.
  # Gotenberg is MIT licensed and runs LibreOffice in its own container, so active content never runs in the product.
  gotenberg:
    image: gotenberg/gotenberg:8.32.0
    ports: ["3000:3000"]

  # Text of PDFs and OCR of scans and pictures for search (spec 011 FR-020). Set Ocr__Tika__Url=http://localhost:9998.
  # Apache Tika (Apache-2.0) with Tesseract runs in its own container, so crafted files are never parsed in the product.
  tika:
    build:
      context: ../docker
      dockerfile: tika-ocr.Dockerfile
    ports: ["9998:9998"]

  # Object storage: R0 uses the file-system adapter. MinIO joins with the S3 adapter in R1.

volumes:
  pgdata:
