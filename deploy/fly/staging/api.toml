# Staging API: the development host in Staging (deploy/docker/api-staging.Dockerfile, spec 003 US7, ADR-0004).
# Private network only; the web app proxies /api and /dev to it. App name comes from the deploy workflow.
# Secrets set by the workflow: ConnectionStrings__App, ConnectionStrings__Owner and, when provided,
# Auth__DevSignIn__TestAccounts__0__Password.
primary_region = "fra"


[env]
  ASPNETCORE_ENVIRONMENT = "Staging"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.live]
    type = "http"
    port = 8080
    path = "/health/live"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
