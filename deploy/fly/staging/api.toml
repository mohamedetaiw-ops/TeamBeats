# Staging API: the development host in Staging (deploy/docker/api-staging.Dockerfile, spec 003 US7, ADR-0004).
# Private network only; the web app proxies /api and /dev to it. App name comes from the deploy workflow.
# Secrets set by the workflow: ConnectionStrings__App, ConnectionStrings__Owner.
primary_region = "fra"


[env]
  ASPNETCORE_ENVIRONMENT = "Staging"
  # Push services may contact this address about our VAPID signed messages (spec 030 push, RFC 8292).
  Integrations__WebPush__Subject = "https://teambeats-staging-web.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.live]
    type = "http"
    port = 8080
    path = "/health/live"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
