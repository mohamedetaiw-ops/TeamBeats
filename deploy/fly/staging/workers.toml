# Staging workers: outbox dispatch, audit sealing and retention (deploy/docker/workers.Dockerfile, the production image).
# Private network only. Secret set by the workflow: ConnectionStrings__App.
primary_region = "fra"


[env]
  ASPNETCORE_ENVIRONMENT = "Staging"
  # The production workers image has no fake Microsoft 365; on staging the API host runs directory sync against the fakes.
  Workers__DirectorySync__Enabled = "false"

# Workers stop the host when a background job fails (for example before the API has applied migrations); always restart.
[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.live]
    type = "http"
    port = 8080
    path = "/health/live"
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
