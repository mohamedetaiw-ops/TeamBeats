name: Shell tools on the Windows runner
description: >-
  Run this right after actions/checkout. It puts Git Bash first on PATH for the rest of the job, because `shell: bash`
  otherwise finds the WSL launcher in C:\Windows\System32. It also adds PowerShell 7, because the actions toolkit needs
  pwsh to unpack downloads that have no .zip extension (setup-flyctl and sbom-action do this), and Windows PowerShell
  5.1 cannot.
runs:
  using: composite
  steps:
    - shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $version = '7.6.9'
        $sha256 = 'ce7484804c0f0ad4dda10c958e71acdaf7eebfb22505c1b480f89e0e9f1da94d'
        $dir = Join-Path $env:RUNNER_TOOL_CACHE "pwsh\$version"
        if (-not (Test-Path "$dir\pwsh.exe")) {
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
          $zip = Join-Path $env:RUNNER_TEMP 'pwsh.zip'
          Invoke-WebRequest "https://github.com/PowerShell/PowerShell/releases/download/v$version/PowerShell-$version-win-x64.zip" -OutFile $zip -UseBasicParsing
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $sha256) { throw 'PowerShell download failed its checksum' }
          New-Item -ItemType Directory -Force $dir | Out-Null
          & "$env:WINDIR\System32\tar.exe" -xf $zip -C $dir
          if ($LASTEXITCODE -ne 0) { throw 'Could not unpack PowerShell' }
          Remove-Item $zip
        }
        Add-Content $env:GITHUB_PATH $dir
        Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\bin'
