# R0 CI gates (docs/architecture/r0-solution-structure.md section 8).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every job runs on GitHub-hosted runners. The repository is public, so never add a self-hosted runner: anyone can
# open a pull request, and a self-hosted runner would run that code on the machine that hosts it.

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEAMBEATS_TEST_PG_ADMIN: Host=localhost;Port=5432;Username=postgres;Password=ci_only_password
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore TeamBeats.slnx
      - run: dotnet build TeamBeats.slnx --no-restore -c Release
      - name: Unit tests
        run: dotnet test tests/Unit --no-build -c Release
      - name: Architecture tests
        run: dotnet test tests/Architecture --no-build -c Release
      - name: Integration tests (includes OpenAPI diff)
        run: dotnet test tests/Integration --no-build -c Release
      - name: Security tests (RLS and cross-tenant suite)
        run: dotnet test tests/Security --no-build -c Release
      - name: Production artifact check (ADR-0004)
        run: |
          dotnet publish src/Api/TeamBeats.Api.csproj -c Release -o out/api
          dotnet publish src/Workers/TeamBeats.Workers.csproj -c Release -o out/workers
          if ls out/api out/workers | grep -qE "Identity\.DevAuth|DevFakes"; then
            echo "Development sign-in or fake external systems found in a production artifact." >&2
            exit 1
          fi
      - name: Vulnerable or deprecated packages
        run: |
          dotnet list TeamBeats.slnx package --vulnerable --include-transitive | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/package-lock.json
      - run: npm ci
      - name: Typecheck, literal-string lint, logical-CSS lint, missing-key gate
        run: npm run verify
      - run: npm run build
      # Exception: @img/sharp-libvips-* (LGPL-3.0-or-later, OSI approved) is the native image library that Next.js
      # installs as an optional dependency of sharp. It is dynamically loaded and unmodified. Recorded in
      # docs/architecture/r0-implementation-notes.md for the owner's decision.
      - name: Licence allow list (constitution XXII)
        run: npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages --excludePackagesStartingWith "@img/sharp-libvips" --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;BlueOak-1.0.0;CC0-1.0;MPL-2.0;Python-2.0;Unlicense;CC-BY-4.0;OFL-1.1"

  e2e:
    # Playwright end-to-end suite (tests/Acceptance, docs/testing/e2e-plan.md): web, development API host and
    # PostgreSQL together, in Arabic and English, with axe accessibility checks.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/Web/package-lock.json
            tests/Acceptance/package-lock.json
      - name: Database roles (development passwords from deploy/compose, CI only)
        env:
          PGPASSWORD: ci_only_password
        run: >-
          psql -h localhost -U postgres -v ON_ERROR_STOP=1
          -v owner_password=tb_owner_dev_only -v app_password=tb_app_dev_only -v operator_password=tb_operator_dev_only
          -f deploy/db/bootstrap.sql
      - run: dotnet build src/Api.DevHost
      - run: npm ci
        working-directory: src/Web
      - run: npm ci
        working-directory: tests/Acceptance
      - name: Typecheck the suite
        run: npm run typecheck
        working-directory: tests/Acceptance
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/Acceptance
      - name: Playwright
        run: npx playwright test
        working-directory: tests/Acceptance
      # Uploaded only on failure, and kept briefly, to stay inside the artifact storage budget.
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/Acceptance/playwright-report
            tests/Acceptance/test-results
          retention-days: 7

  governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Scanner binaries come from GitHub release downloads, which return 504 for long stretches. They are cached by
      # version so an outage there does not fail the job; a cache miss downloads them once and checks their hashes.
      - name: Restore governance tools
        id: tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tools
          key: governance-tools-gitleaks-8.24.3-syft-1.18.1
      - name: Download governance tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          get() {
            curl -sSfL --retry 10 --retry-delay 15 --retry-all-errors --retry-max-time 600 -o "$RUNNER_TEMP/tools/$2" "$1"
            echo "$3  $RUNNER_TEMP/tools/$2" | sha256sum -c -
          }
          get https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz gitleaks.tar.gz \
            9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          get https://github.com/anchore/syft/releases/download/v1.18.1/syft_1.18.1_linux_amd64.tar.gz syft.tar.gz \
            066c251652221e4d44fcc4d115ce3df33a91769da38c830a8533199db2f65aab
      - name: Install governance tools
        run: |
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  $RUNNER_TEMP/tools/gitleaks.tar.gz" | sha256sum -c -
          echo "066c251652221e4d44fcc4d115ce3df33a91769da38c830a8533199db2f65aab  $RUNNER_TEMP/tools/syft.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/tools/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          tar -xzf "$RUNNER_TEMP/tools/syft.tar.gz" -C "$RUNNER_TEMP/bin" syft
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret scan
        # Scans the commits of the pull request or push. Findings fail the job and appear in the log.
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            range="origin/$GITHUB_BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi
          gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="$range" .
      - name: SBOM
        # Generated on every run; uploading is off until artifact storage is budgeted (release builds will attach it).
        run: syft scan dir:. -o spdx-json=teambeats-sbom.spdx.json
      - name: Deployment manifest lint (constitution V, ADR-0004)
        run: tools/deploy-lint.sh
      - name: spec-lint
        if: github.event_name == 'pull_request'
        env:
          PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: tools/spec-lint.sh "origin/${{ github.base_ref }}" "$PR_TEXT"
