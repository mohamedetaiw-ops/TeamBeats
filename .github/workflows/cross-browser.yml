# Nightly design suite in Firefox and WebKit (spec 036 T012, docs/testing/e2e-plan.md row 4). Pull requests keep
# running Chromium only; this run never blocks one. It checks what the design suite checks (the design reaching the
# page, accessibility, no sideways scrolling, target size) and ignores the pixel baselines, which are Chromium's.
name: cross-browser

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/cross-browser.yml

permissions:
  contents: read

jobs:
  design-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_CROSS_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/Web/package-lock.json
            tests/Acceptance/package-lock.json
      - name: Database roles (development passwords from deploy/compose, CI only)
        env:
          PGPASSWORD: ci_only_password
        run: >-
          psql -h localhost -U postgres -v ON_ERROR_STOP=1
          -v owner_password=tb_owner_dev_only -v app_password=tb_app_dev_only -v operator_password=tb_operator_dev_only
          -f deploy/db/bootstrap.sql
      - run: dotnet build src/Api.DevHost
      - run: npm ci
        working-directory: src/Web
      - run: npm ci
        working-directory: tests/Acceptance
      - name: Typecheck the suite
        run: npm run typecheck
        working-directory: tests/Acceptance
      - name: Install ${{ matrix.browser }}
        run: |
          npx playwright install ${{ matrix.browser }}
          timeout 300 npx playwright install-deps ${{ matrix.browser }} || echo "::warning::Playwright OS packages could not be installed; using the runner image's libraries"
        working-directory: tests/Acceptance
      - name: Design suite
        run: npx playwright test --project=${{ matrix.browser }} --ignore-snapshots
        working-directory: tests/Acceptance
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-${{ matrix.browser }}
          path: |
            tests/Acceptance/playwright-report
            tests/Acceptance/test-results
          retention-days: 7
