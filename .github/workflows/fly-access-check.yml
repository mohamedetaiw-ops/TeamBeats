# Read-only check that GitHub Actions can reach Fly.io (staging target) with the
# FLY_API_TOKEN repository secret. It lists identity and apps only; it never
# creates, deploys or changes Fly resources.
name: fly-access-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/fly-access-check.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fly-read-only:
    # Never run code from a fork on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, teambeats]
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Check the secret is present
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN repository secret is missing or not available to this run"
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Show flyctl version
        run: flyctl version
      - name: List orgs (read-only, informational)
        continue-on-error: true
        run: flyctl orgs list
      - name: List apps (read-only)
        run: flyctl apps list
